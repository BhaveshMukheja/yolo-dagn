sdss:
  base_url: "http://skyserver.sdss.org/dr16/SkyServerWS/ImgCutout/getjpeg"

  image:
    width: 120
    height: 120
    scale: 0.3

  request:
    timeout: 10
    max_retries: 5
    backoff_factor: 2
    delay_between_requests: 0.2

columns:
  obj_id: "ObjID"
  ra: "RA"
  dec: "DEC"

datasets:
  gothic_confirmed:
    csv_path: "data/baselineModel/681_from_GOTHIC.csv"
    save_dir: "data/baselineModel/images"
    limit: null

  train:
    csv_path: "data/baselineModel/train/train.csv"
    save_dir: "data/baselineModel/train/images"
    limit: null

  val:
    csv_path: "data/baselineModel/val/val.csv"
    save_dir: "data/baselineModel/val/images"
    limit: null

  test:
    csv_path: "data/baselineModel/test/test.csv"
    save_dir: "data/baselineModel/test/images"
    limit: null
    batch_size: 5000
