sdss:
  base_url: "http://skyserver.sdss.org/dr16/SkyServerWS/ImgCutout/getjpeg"

  image:
    width: 120
    height: 120
    scale: 0.3

  request:
    timeout: 10
    max_retries: 5
    backoff_factor: 2
    delay_between_requests: 0.2

columns:
  obj_id: "ObjID"
  ra: "RA"
  dec: "DEC"

datasets:
  gothic_confirmed:
    csv_path: "data/baselineModel/681_from_GOTHIC.csv"
    save_dir: "data/finalModel/images/gothic"
    limit: null

  bootstrapped:
    csv_path: "data/finalModel/bootstrapped_data.csv"
    save_dir: "data/finalModel/images/bootstrapped"
    limit: null

  stars:
    csv_path: "data/finalModel/stars.csv"
    save_dir: "data/finalModel/images/stars"
    limit: null

  train:
    csv_path: "data/finalModel/train/train.csv"
    save_dir: "data/finalModel/train/images"
    limit: null

  val:
    csv_path: "data/finalModel/val/val.csv"
    save_dir: "data/finalModel/val/images"
    limit: null

  test:
    csv_path: "data/finalModel/test/test.csv"
    save_dir: "data/finalModel/test/images"
    limit: null
    batch_size: 5000
