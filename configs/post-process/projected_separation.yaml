# ============================================================
# INPUT / OUTPUT
# ============================================================

labels_dir: failed

output_csv: failed/projected_separations.csv

# ============================================================
# IMAGE SETTINGS
# ============================================================

image_size: 120

pixel_scale_arcsec: 0.3

target_class: 0

# ============================================================
# SDSS
# ============================================================

sdss:

  sql_url: "https://skyserver.sdss.org/dr16/SkyServerWS/SearchTools/SqlSearch"

  timeout: 20

  max_retries: 3

# ============================================================
# COSMOLOGY
# ============================================================

cosmology:

  H0: 70

  Om0: 0.3

# ============================================================
# PIPELINE
# ============================================================

save_every: 500

log_level: INFO